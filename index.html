<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>STRAT WALL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="live-dot"></span>
      STRAT WALL
      <a class="nav" href="insights.html">INSIGHTS</a>
      <a class="nav" href="insights.html#predict">PREDICT</a>
    </div>
    <div class="meta" id="meta">loading…</div>
    <div class="controls">
      <label>SESSION
        <select id="session"></select>
      </label>
      <label>DRIVER
        <select id="driver"></select>
      </label>
      <label>RIVAL
        <select id="react">
          <option value="">frozen</option>
          <option value="1">react file</option>
          <option value="0">no react</option>
        </select>
      </label>
    </div>
  </header>

  <div class="flags" id="flags"></div>

  <main class="grid">
    <section class="panel tower-panel">
      <h2>TIMING TOWER <span id="tower-sub"></span></h2>
      <div class="tower-head">
        <span>P</span><span>DRIVER</span><span>GAP @ FORK</span><span>TYRE</span>
      </div>
      <div id="tower"></div>
    </section>

    <section class="panel call-panel">
      <h2>RACE ENGINEER</h2>
      <div id="call"></div>
    </section>

    <section class="panel strat-panel">
      <h2>STRATEGY LADDER <span>WIN · E[POS]</span></h2>
      <div id="ladder"></div>
    </section>
  </main>

  <section class="panel stint-panel">
    <h2>STINT MAP <span>white pit · red halt · cyan fork</span></h2>
    <div id="stints"></div>
  </section>

  <footer class="caveats" id="caveats"></footer>
  <script src="app.js"></script>
</body>
</html>
